name: Verificación

on:
  push:
  pull_request:

jobs:
  python-igual-web:
    name: Python = web (mapa de condiciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Las 128 condiciones dan lo mismo en Python y en la web
        run: python verificacion/comparar_mapa.py

      - name: El modelo 3D es sólido y coincide con el cálculo
        run: node verificacion/prueba_3d.js

      - name: La página publicada está armada con las fuentes actuales
        run: |
          python web/armar.py
          git diff --exit-code docs/index.html
